<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light">
<title>Table Generator</title>
<meta name="description" content="Design an aluminium-extrusion robot test table in 3D. Get sim-ready URDF, MuJoCo, USD and glTF with cameras, a bill of materials and the build plan.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 16 16%22%3E%3Crect width=%2216%22 height=%2216%22 rx=%224%22 fill=%22%2314171a%22/%3E%3Cpath d=%22M3.5 5h9v1.4h-9zM4.3 6.4h1.3v6H4.3zM10.4 6.4h1.3v6h-1.3zM5.6 9.4h4.8v1H5.6z%22 fill=%22%23fff%22/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="./src/style.css">
</head>
<body>
<div id="world" aria-label="3D table. Drag to orbit, scroll to zoom, click a part to edit it."></div>

<aside class="side" id="side" aria-label="Table Generator">
  <div class="side-b" id="side-b">
    <div id="selected"></div>
    <div id="form"></div>
  </div>
  <div class="side-f">
    <button type="button" class="btn solid grow" data-dl="zip"><svg viewBox="0 0 16 16"><path d="M8 2v8M4.5 6.5L8 10l3.5-3.5M2.5 13.5h11"/></svg>Download everything</button>
    <button type="button" class="btn icon" id="share" title="Copy link to this design" aria-label="Copy link"><svg viewBox="0 0 16 16"><path d="M6.5 9.5l3-3M7 4.5l1-1a2.8 2.8 0 0 1 4 4l-1 1M9 11.5l-1 1a2.8 2.8 0 0 1-4-4l1-1"/></svg></button>
    <details class="more"><summary class="btn" aria-label="More formats"><svg viewBox="0 0 16 16"><path d="M4 6l4 4 4-4"/></svg></summary>
      <div class="menu">
        <button type="button" data-dl="mjcf">MuJoCo <span>.zip</span></button>
        <button type="button" data-dl="urdf">URDF <span>.zip</span></button>
        <button type="button" data-dl="usd">OpenUSD <span>.usda</span></button>
        <button type="button" data-dl="glb">glTF <span>.glb</span></button>
        <button type="button" data-dl="cams">Cameras <span>.json</span></button>
        <button type="button" data-dl="bom">Parts list <span>.csv</span></button>
        <button type="button" data-dl="png">Picture <span>.png</span></button>
        <label>Load params<input type="file" id="load" accept="application/json,.json" hidden><span>.json</span></label>
        <button type="button" id="reset">Reset design</button>
        <button type="button" id="collapse">Hide sidebar</button>
      </div>
    </details>
  </div>
</aside>
<button type="button" class="open-side" id="open-side" aria-label="Show sidebar" hidden><svg viewBox="0 0 16 16"><path d="M3 4.5h10M3 8h10M3 11.5h10"/></svg></button>

<div class="pip" id="pip" hidden>
  <div class="pip-view" id="pip-view"></div>
  <div class="pip-tabs" id="pip-tabs" role="tablist" aria-label="Camera"></div>
  <button type="button" class="pip-close" id="pip-close" aria-label="Hide camera view"><svg viewBox="0 0 16 16"><path d="M4 4l8 8M12 4l-8 8"/></svg></button>
</div>
<div class="tip" id="tip" hidden></div>
<div class="placing" id="placing" hidden><span>Click a rail or post to mount <b id="placing-name"></b></span><button type="button" class="ghost" id="placing-cancel">Cancel</button></div>
<div class="toast" id="toast" role="status" hidden></div>
<script type="module" src="./src/main.ts"></script>
</body>
</html>
